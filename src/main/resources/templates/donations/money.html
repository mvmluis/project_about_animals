<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doação em Dinheiro — Pet Alerta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
</head>
<body>
<main class="auth">
    <section class="auth-card" style="grid-template-columns: 1fr; width:min(780px, 100%);">
        <div class="panel" style="padding:26px;">

            <!-- Header -->
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;">
                <div>
                    <h2 style="margin:0;">Doação em Dinheiro</h2>
                    <div class="subtitle" style="margin:6px 0 0 0;">
                        Pagamento via PayPal.
                    </div>
                </div>

                <a th:href="@{/donations}"
                   style="height:40px; display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:14px;
                          border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.92);
                          text-decoration:none; white-space:nowrap;">
                    Voltar
                </a>
            </div>

            <form th:action="@{/donations/money}" method="post" th:object="${form}">

                <!-- Card: Montante -->
                <div style="border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); border-radius:18px; padding:14px;">
                    <label style="display:block; margin-bottom:8px; color: rgba(255,255,255,.80); font-size:13px; font-weight:700;">
                        Montante (EUR)
                    </label>

                    <input th:field="*{amount}" type="number" step="0.01" min="1.00"
                           placeholder="Ex.: 10.00"
                           style="width:100%; height:42px; border-radius:14px; border:1px solid rgba(255,255,255,.14);
                                  background:rgba(8,12,24,.35); color: rgba(255,255,255,.92); padding:0 12px; outline:none;">

                    <div style="margin-top:8px; color: rgba(255,255,255,.55); font-size:12px;">
                        Valor mínimo: 1,00 €. Vais ser redirecionado para o PayPal para concluir.
                    </div>

                    <div th:if="${#fields.hasErrors('amount')}" style="color:#fca5a5; margin-top:8px; font-size:12px;">
                        Montante inválido (mín. 1,00).
                    </div>
                </div>

                <!-- Actions -->
                <div style="margin-top:16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;">
                    <button class="btn" type="submit"
                            style="padding:10px 16px; border-radius:14px; height:42px; width:min(520px, 100%);">
                        Continuar para PayPal
                    </button>
                </div>

            </form>
        </div>
    </section>
</main>
</body>
</html>
