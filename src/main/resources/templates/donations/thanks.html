<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obrigado — Pet Alerta</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
</head>
<body>
<main class="auth">
  <section class="auth-card" style="grid-template-columns: 1fr; width:min(780px, 100%);">
    <div class="panel" style="padding:26px;">
      <h2 style="margin:0 0 10px 0;">Obrigado ❤️</h2>

      <div th:if="${type == 'products'}" style="color:rgba(255,255,255,.85);">
        Recebemos a tua doação de produtos. Vamos contactar-te se necessário.
      </div>

      <div th:if="${type == 'money'}" style="color:rgba(255,255,255,.85);">
        Pagamento confirmado. Obrigado por ajudares os caezinhos!
      </div>

      <div style="margin-top:16px; display:flex; gap:10px;">
        <a th:href="@{/donations/history}" class="btn" style="padding:10px 14px; border-radius:14px; height:40px; display:inline-flex; align-items:center;">
          Ver histórico
        </a>
        <a th:href="@{/reports}" style="height:40px; display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:14px;
                  border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.92); text-decoration:none;">
          Voltar
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
