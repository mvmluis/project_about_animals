<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de Doações — Pet Alerta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
</head>
<body>
<main class="auth">
    <section class="auth-card" style="grid-template-columns: 1fr; width:min(1100px, 100%);">
        <div class="panel" style="padding:26px;">

            <!-- Header: título à esquerda, voltar à direita -->
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px 0;">
                <h2 style="margin:0;">Histórico de Doações</h2>

                <a th:href="@{/donations}"
                   style="height:40px; display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:14px;
                          border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.92);
                          text-decoration:none; white-space:nowrap;">
                    Voltar
                </a>
            </div>

            <div style="border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); border-radius:18px; overflow:hidden;">
                <div style="overflow:auto;">
                    <table style="width:100%; border-collapse: collapse; min-width: 900px;">
                        <thead>
                        <tr style="background: rgba(255,255,255,.06);">
                            <th style="text-align:left; padding:14px; font-size:12px; color: rgba(255,255,255,.70); border-bottom:1px solid rgba(255,255,255,.12);">ID</th>
                            <th style="text-align:left; padding:14px; font-size:12px; color: rgba(255,255,255,.70); border-bottom:1px solid rgba(255,255,255,.12);">Tipo</th>
                            <th style="text-align:left; padding:14px; font-size:12px; color: rgba(255,255,255,.70); border-bottom:1px solid rgba(255,255,255,.12);">Detalhes</th>
                            <th style="text-align:left; padding:14px; font-size:12px; color: rgba(255,255,255,.70); border-bottom:1px solid rgba(255,255,255,.12);">Estado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${items}" style="border-bottom:1px solid rgba(255,255,255,.10);">
                            <td style="padding:14px;" th:text="${d.id}"></td>
                            <td style="padding:14px;" th:text="${d.type}"></td>
                            <td style="padding:14px; color: rgba(255,255,255,.85);">
                                <span th:if="${d.type.name() == 'PRODUCTS'}"
                                      th:text="${d.productCategory + ' — ' + d.quantity}"></span>
                                <span th:if="${d.type.name() == 'MONEY'}"
                                      th:text="${d.amount + ' ' + d.currency}"></span>
                            </td>
                            <td style="padding:14px;" th:text="${d.status}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="4" style="padding:18px; color: rgba(255,255,255,.70);">
                                Ainda não tens doações registadas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div style="margin-top:16px; text-align:center;">
                <a th:href="@{/donations}" class="btn"
                   style="padding:10px 14px; border-radius:14px; height:40px;
              display:flex; align-items:center; justify-content:center; width:100%;">
                    Nova doação
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
