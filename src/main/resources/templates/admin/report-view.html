<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pet Alert — Admin (Detalhe)</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{'/favicon.ico?v=' + ${#dates.createNow().time}}">
</head>
<body>

<main class="auth">
    <section class="auth-card" style="grid-template-columns: 1fr; width: min(1000px, 100%);">
        <div class="panel" style="padding: 26px;">

            <!-- Header -->
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;">
                <div>
                    <h2 style="margin-bottom:6px;">Admin — Detalhe do registo</h2>
                    <div class="subtitle" style="margin:0;">
                        Rever report, atualizar estado e moderar conteúdo.
                    </div>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <a th:href="@{/admin/reports}"
                       style="display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.92); text-decoration:none;">
                        Voltar
                    </a>
                </div>
            </div>

            <!-- Top summary cards -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom:14px;">
                <div style="border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); border-radius:18px; padding:16px;">
                    <div style="display:grid; gap:10px;">
                        <div style="display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid rgba(255,255,255,.10); padding-bottom:10px;">
                            <div style="color: rgba(255,255,255,.65); font-size:12px;">ID</div>
                            <div style="color: rgba(255,255,255,.92); font-size:13px;" th:text="${report.id}"></div>
                        </div>

                        <div style="display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid rgba(255,255,255,.10); padding-bottom:10px;">
                            <div style="color: rgba(255,255,255,.65); font-size:12px;">Título</div>
                            <div style="color: rgba(255,255,255,.92); font-size:13px; text-align:right;" th:text="${report.title}"></div>
                        </div>

                        <div style="display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid rgba(255,255,255,.10); padding-bottom:10px;">
                            <div style="color: rgba(255,255,255,.65); font-size:12px;">Espécie</div>
                            <div style="color: rgba(255,255,255,.85); font-size:13px;" th:text="${report.species}"></div>
                        </div>

                        <div style="display:flex; justify-content:space-between; gap:10px;">
                            <div style="color: rgba(255,255,255,.65); font-size:12px;">Local</div>
                            <div style="color: rgba(255,255,255,.85); font-size:13px; text-align:right;" th:text="${report.locationText}"></div>
                        </div>
                    </div>
                </div>

                <div style="border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); border-radius:18px; padding:16px;">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                        <div style="color: rgba(255,255,255,.92); font-weight:700;">Status</div>
                        <span th:text="${report.status}"
                              style="display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); font-size:13px;">
                        </span>
                    </div>

                    <div style="height:12px;"></div>

                    <!-- Update status -->
                    <form th:action="@{/admin/reports/{id}/status(id=${report.id})}" method="post"
                          style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0;">
                        <label style="color: rgba(255,255,255,.75); font-size:12px;">Mudar status</label>

                        <select name="status"
                                style="min-width: 220px; padding:10px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.20); color: rgba(255,255,255,.92);">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${s == report.status}">
                            </option>
                        </select>

                        <button type="submit"
                                style="width:auto; padding:10px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.10); color: rgba(255,255,255,.92); font-weight:800; cursor:pointer;">
                            Atualizar
                        </button>
                    </form>

                    <div class="small" style="margin-top:10px; color: rgba(255,255,255,.55);">
                        Atualiza o estado para refletir resgate/encontro/adoção.
                    </div>
                </div>
            </div>

            <!-- Photo + actions -->
            <div style="display:grid; grid-template-columns: 1fr; gap: 14px;">
                <div style="border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); border-radius:18px; padding:16px;">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
                        <div style="color: rgba(255,255,255,.92); font-weight:700;">Foto</div>
                        <div class="small" style="color: rgba(255,255,255,.55);">JPG/PNG/WebP</div>
                    </div>

                    <div th:if="${report.photoUrl != null}">
                        <img th:src="${report.photoUrl}"
                             alt="Foto do animal"
                             style="width:100%; max-height: 520px; object-fit: cover; border-radius:16px; border:1px solid rgba(255,255,255,.14); display:block;">
                    </div>

                    <div th:if="${report.photoUrl == null}">
                        <div class="alert alert-warning" style="margin:0;">
                            <span class="dot"></span>
                            <div>Sem foto associada.</div>
                        </div>
                    </div>
                </div>

                <!-- Delete -->
                <div style="border:1px solid rgba(239,68,68,.30); background: rgba(239,68,68,.08); border-radius:18px; padding:16px;">
                    <div style="color: rgba(255,255,255,.92); font-weight:800; margin-bottom:8px;">
                        Zona de perigo
                    </div>
                    <div class="small" style="color: rgba(255,255,255,.70); margin-bottom:12px;">
                        Apagar remove permanentemente este registo.
                    </div>

                    <form th:action="@{/admin/reports/{id}/delete(id=${report.id})}"
                          method="post"
                          style="margin:0;"
                          onsubmit="return confirm('Tens a certeza que queres apagar este relatório? Esta ação é permanente.');">
                        <button type="submit"
                                style="width:auto; padding:10px 14px; border-radius:14px; border:1px solid rgba(239,68,68,.45); background: rgba(239,68,68,.12); color: rgba(255,255,255,.95); font-weight:900; cursor:pointer;">
                            Apagar
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </section>
</main>

</body>
</html>
